# .github/workflows/jstar-review.yml
# J Star Code Review - Automated PR Reviewer
# 
# This workflow runs on the jstar-code-review repo itself (self-hosting).
# For OTHER repos, use the reusable workflow instead (see spawn-template.yml)
#
# Triggers on: PR open/update, or manual '/review' comment

name: J Star Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# Permissions needed for posting comments
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Gate job to check if we should run
  check:
    name: 🔍 Check Trigger
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if should run
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "issue_comment" && \
                  "${{ contains(github.event.comment.body, '/review') }}" == "true" && \
                  "${{ github.event.issue.pull_request != null }}" == "true" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  review:
    name: 🌟 J Star Review
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_run == 'true'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for diff analysis
          fetch-depth: 0

      - name: � Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: �🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🤖 Run J Star Reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TRIAGE_MODEL: openai/gpt-oss-120b
          ANALYST_MODEL: moonshotai/kimi-k2-instruct-0905
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: npx tsx src/orchestrator.ts
